<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Unstuck">
  <title>Unstuck</title>
  <!-- A closed loop is what being stuck looks like: going round the same
       question. This loop has a gap, and something is leaving through it.
       currentColor, no gradient and no brand hue -- the one rule of this
       design is that colour means a model's stance, and a logo has none. -->
  <path d="M25.5 21.5 A11 11 0 1 1 21.5 6.5"
        stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M17.5 15 L28 5.4" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M22.6 5 L28.4 5 L28.4 10.8"
        stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
